<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<style>

body{
    margin:0;
    font-family:Arial;
}

/* Header */
.header{
    background:#2c3e50;
    color:white;
    padding:15px;
    text-align:center;
}

/* Sidebar */
.sidebar{
    height:100vh;
    width:200px;
    position:fixed;
    background:#34495e;
    padding-top:20px;
}

.sidebar a{
    display:block;
    color:white;
    padding:12px;
    text-decoration:none;
}

.sidebar a:hover{
    background:#1abc9c;
}

/* Main Content */
.main{
    margin-left:210px;
    padding:20px;
}

/* Cards */
.card{
    display:inline-block;
    width:200px;
    padding:20px;
    margin:10px;
    background:#ecf0f1;
    text-align:center;
    border-radius:8px;
    box-shadow:0 0 5px gray;
}

</style>

</head>

<body>

<div class="header">
<h2>My Dashboard</h2>
</div>

<div class="sidebar">
<a href="#">Home</a>
<a href="#">Profile</a>
<a href="#">Orders</a>
<a href="#">Reports</a>
<a href="#">Logout</a>
</div>

<div class="main">

<h2>Welcome to Dashboard</h2>

<div class="card">
<h3>120</h3>
<p>Total Users</p>
</div>

<div class="card">
<h3>75</h3>
<p>Orders</p>
</div>

<div class="card">
<h3>15</h3>
<p>Products</p>
</div>

<div class="card">
<h3>10</h3>
<p>Messages</p>
</div>

</div>

</body>
</html>
